# Render Blueprint for Community United Network.
# In Render: New → Blueprint → select this repo and branch. Render creates the web service and database.
services:
  - type: web
    name: community-united-network
    runtime: node
    rootDir: community-united-network
    plan: starter
    # Dev dependencies (TypeScript) are needed to build, so include them.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/tasks
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: cun-db
          property: connectionString

databases:
  - name: cun-db
    databaseName: cun
    plan: basic-256mb
